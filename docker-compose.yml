# ===========================
# Etapa 1: Composer dependencies
# ===========================
FROM composer:2 AS vendor

# Define diretório de trabalho
WORKDIR /app

# Copia apenas os arquivos de dependência
COPY backend-api/composer.json backend-api/composer.lock ./

# Instala dependências do Laravel sem rodar scripts (artisan ainda não existe)
RUN composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist


# ===========================
# Etapa 2: PHP Application
# ===========================
FROM php:8.2-cli

# Evita prompts interativos durante o apt-get
ENV DEBIAN_FRONTEND=noninteractive
ENV TERM=xterm

# Instala pacotes necessários e extensões PHP
RUN apt-get update && apt-get install -y \
    git unzip zip libpq-dev libzip-dev libssl-dev libpng-dev libonig-dev \
    && docker-php-ext-install pdo pdo_pgsql zip \
    && pecl install redis \
    && docker-php-ext-enable redis \
    && rm -rf /var/lib/apt/lists/*

# Copia dependências do Composer da primeira etapa
COPY --from=vendor /app/vendor /var/www/html/vendor

# Copia o restante da aplicação Laravel
COPY backend-api /var/www/html

# Define diretório de trabalho da aplicação
WORKDIR /var/www/html

# Gera APP_KEY se não existir (ignora erro se já existir)
RUN php artisan key:generate --show || true

# Expondo a porta padrão (8080)
EXPOSE 8080

# =====================================
# 🚀 Comando de inicialização do servidor Laravel
# =====================================
# O Laravel vai subir diretamente na porta 8080 (fixa)
CMD ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]